<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLAM — Play</title>
</head>
<body>
  <h1>🎮 GLAM — Play</h1>
  <div id="sub">One engine — any lesson. Your teacher crafted this world for you.</div>

  <div id="scenarioTitle"></div>
  <div id="topbar">
    <select id="scenarioSelect">
      <option value="/scenarios/example.json">💰 Money Management Town — Example</option>
    </select>
    <button id="restartBtn">🔄 Restart</button>
    <div id="statsBar"></div>
  </div>
  <div id="assetStatus" class="assetStatus">Assets cached: —</div>
  <div id="main">
    <div id="gameWrap">
      <div id="game"></div>
      <div id="prompt"></div>
    </div>
    <div id="missionPanel">
      <h3>📋 Objectives</h3>
      <div id="missionList"></div>
    </div>
  </div>
  <div id="controlsHint">Arrow keys / WASD to move · E to interact · Walk next to an entity to trigger</div>
  <div id="modalOverlay"><div id="modal"></div></div>
  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
